<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slutrunder, kampe og mål – Landsholdskortet</title>
  <meta name="description" content="Scatterplot over danske A-landsholdsspillere: antal slutrunder (EM/VM/OL) vs. antal kampe. Prikkernes størrelse viser antal mål.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://landsholdskortet.dk/scatterplot/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/inter.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", -apple-system, sans-serif; background: #f4f4f4; color: #1a1a1a; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .topbar { background: #C8102E; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
    .topbar a { color: #fff; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .topbar a:hover { text-decoration: none; opacity: .85; }
    .page { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 16px; }
    .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .pill { padding: 6px 14px; border-radius: 20px; border: 1px solid #ddd; background: #fff; font-size: 13px; cursor: pointer; font-family: inherit; color: #555; }
    .pill.active { background: #C8102E; color: #fff; border-color: #C8102E; }
    .chart-wrap { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.07); position: relative; }
    #chart { width: 100%; display: block; cursor: crosshair; }
    .tooltip {
      position: fixed; pointer-events: none; background: #1a1a1a; color: #fff;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5;
      max-width: 220px; z-index: 100; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }
    .legend { display: flex; gap: 20px; margin-top: 14px; font-size: 12px; color: #888; flex-wrap: wrap; align-items: center; }
    .legend-dot { border-radius: 50%; display: inline-block; vertical-align: middle; background: #C8102E; opacity: 0.7; }
    @media (max-width: 600px) { .page { padding: 16px 10px 40px; } }
  </style>
</head>
<body>
<div class="topbar">
  <a href="/">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M13 17l-7-7 7-7" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
    Landsholdskortet
  </a>
</div>

<div class="page">
  <h1>Slutrunder, kampe og mål</h1>
  <p class="subtitle">Alle spillere der har deltaget i en EM-, VM- eller OL-slutrunde. X-aksen viser antal slutrunder, Y-aksen antal kampe. Prikkens størrelse viser antal mål.</p>

  <div class="controls">
    <button class="pill active" onclick="setGender('alle',this)">Alle</button>
    <button class="pill" onclick="setGender('mand',this)">Mænd</button>
    <button class="pill" onclick="setGender('kvinde',this)">Kvinder</button>
  </div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
    <div class="legend">
      <span><span class="legend-dot" style="width:8px;height:8px;margin-right:4px"></span>Lille prik = få mål</span>
      <span><span class="legend-dot" style="width:18px;height:18px;margin-right:4px"></span>Stor prik = mange mål</span>
      <span style="color:#C8102E">●</span> Mænd &nbsp;
      <span style="color:#e87fa8">●</span> Kvinder
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const RAW = [];
</script>
<script src="/data/scatter_slutrunder.json" type="application/json" id="scatter-data"></script>
<script>
(function() {
  const raw = JSON.parse(document.getElementById('scatter-data').textContent || '[]');

  // Fallback: fetch
  let data = raw.length ? raw : [];

  const canvas = document.getElementById('chart');
  const tooltip = document.getElementById('tooltip');
  let currentGender = 'alle';
  let filtered = [];

  const PAD = { top: 20, right: 20, bottom: 50, left: 55 };
  const MAN_COLOR   = 'rgba(200,16,46,0.75)';
  const WOMAN_COLOR = 'rgba(232,127,168,0.80)';
  const MAN_STROKE  = 'rgba(200,16,46,1)';
  const WOMAN_STROKE= 'rgba(200,60,120,1)';

  function dotRadius(maal, maxMaal) {
    const min = 4, max = 22;
    if (maxMaal === 0) return min;
    return min + (max - min) * Math.sqrt(maal / maxMaal);
  }

  function draw() {
    filtered = currentGender === 'alle' ? data
      : data.filter(d => d.gender === currentGender);

    const dpr = window.devicePixelRatio || 1;
    const W = canvas.parentElement.clientWidth - 40;
    const H = Math.max(380, Math.min(520, window.innerHeight * 0.55));
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width  = W * dpr;
    canvas.height = H * dpr;

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const maxX = Math.max(...filtered.map(d => d.slutrunder), 1);
    const maxY = Math.max(...filtered.map(d => d.kampe), 1);
    const maxM = Math.max(...filtered.map(d => d.maal), 1);

    const plotW = W - PAD.left - PAD.right;
    const plotH = H - PAD.top  - PAD.bottom;

    function xPos(v) { return PAD.left + (v / maxX) * plotW; }
    function yPos(v) { return PAD.top  + plotH - (v / maxY) * plotH; }

    // Grid
    ctx.strokeStyle = '#eee';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = PAD.top + (plotH / 5) * i;
      ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W - PAD.right, y); ctx.stroke();
    }
    for (let x = 0; x <= maxX; x++) {
      const px = xPos(x);
      ctx.beginPath(); ctx.moveTo(px, PAD.top); ctx.lineTo(px, H - PAD.bottom); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(PAD.left, PAD.top); ctx.lineTo(PAD.left, H - PAD.bottom); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(PAD.left, H - PAD.bottom); ctx.lineTo(W - PAD.right, H - PAD.bottom); ctx.stroke();

    // Y-labels
    ctx.fillStyle = '#999'; ctx.font = '11px Inter, sans-serif'; ctx.textAlign = 'right';
    for (let i = 0; i <= 5; i++) {
      const val = Math.round((maxY / 5) * (5 - i));
      const y = PAD.top + (plotH / 5) * i;
      ctx.fillText(val, PAD.left - 6, y + 4);
    }

    // X-labels
    ctx.textAlign = 'center';
    for (let x = 0; x <= maxX; x++) {
      ctx.fillText(x, xPos(x), H - PAD.bottom + 16);
    }

    // Axis titles
    ctx.fillStyle = '#666'; ctx.font = '12px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Antal slutrunder (EM/VM/OL)', PAD.left + plotW / 2, H - 6);

    ctx.save();
    ctx.translate(14, PAD.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Antal kampe', 0, 0);
    ctx.restore();

    // Dots (sorted so large dots are drawn first)
    const sorted = [...filtered].sort((a, b) => b.maal - a.maal);
    sorted.forEach(d => {
      const x = xPos(d.slutrunder) + (Math.random() - 0.5) * 6; // small jitter
      const y = yPos(d.kampe) + (Math.random() - 0.5) * 6;
      const r = dotRadius(d.maal, maxM);
      const isWoman = d.gender === 'kvinde';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = isWoman ? WOMAN_COLOR : MAN_COLOR;
      ctx.fill();
      ctx.strokeStyle = isWoman ? WOMAN_STROKE : MAN_STROKE;
      ctx.lineWidth = 0.8;
      ctx.stroke();
      d._px = x; d._py = y; d._pr = r;
    });
  }

  // Tooltip
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    let hit = null;
    for (const d of filtered) {
      if (d._px === undefined) continue;
      const dx = mx - d._px, dy = my - d._py;
      if (Math.sqrt(dx*dx + dy*dy) <= d._pr + 3) { hit = d; break; }
    }
    if (hit) {
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top  = (e.clientY - 10) + 'px';
      tooltip.innerHTML = `<strong><a href="/spiller/${slugify(hit.name)}-${hit.dbuID}/" style="color:#f9a8c9">${hit.name}</a></strong><br>
        ${hit.slutrunder} slutrunde${hit.slutrunder !== 1 ? 'r' : ''}<br>
        ${hit.kampe} kampe &nbsp;·&nbsp; ${hit.maal} mål`;
    } else {
      tooltip.style.display = 'none';
    }
  });
  canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    for (const d of filtered) {
      if (d._px === undefined) continue;
      const dx = mx - d._px, dy = my - d._py;
      if (Math.sqrt(dx*dx + dy*dy) <= d._pr + 3) {
        window.location.href = `/spiller/${slugify(d.name)}-${d.dbuID}/`;
        break;
      }
    }
  });

  function slugify(t) {
    return t.toLowerCase()
      .replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa')
      .normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }

  window.setGender = function(g, btn) {
    currentGender = g;
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    draw();
  };

  // Load data via fetch then draw
  fetch('/data/scatter_slutrunder.json')
    .then(r => r.json())
    .then(d => { data = d; draw(); })
    .catch(() => draw());

  window.addEventListener('resize', draw);
})();
</script>
</body>
</html>
