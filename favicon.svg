<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="ball-clip">
      <circle cx="16" cy="16" r="15"/>
    </clipPath>
  </defs>

  <!-- Fodbold base: hvide hexagon-mønstre -->
  <circle cx="16" cy="16" r="15" fill="#f8f8f8"/>

  <!-- Sorte pentagon-felter (klassisk fodbold-mønster) -->
  <g clip-path="url(#ball-clip)" fill="#1a1a1a">
    <!-- Top -->
    <polygon points="16,1 22.5,6.5 20,14 12,14 9.5,6.5"/>
    <!-- Bund-venstre -->
    <polygon points="2,20.5 7.5,16 12,18 12.5,25.5 6,28.5"/>
    <!-- Bund-højre -->
    <polygon points="30,20.5 24.5,16 20,18 19.5,25.5 26,28.5"/>
  </g>

  <!-- Rødt Dannebrog-kors oven på (med transparens) -->
  <g clip-path="url(#ball-clip)" opacity="0.82">
    <!-- Vandret bjælke -->
    <rect x="0" y="13" width="32" height="6" fill="#C8102E"/>
    <!-- Lodret bjælke -->
    <rect x="13" y="0" width="6" height="32" fill="#C8102E"/>
  </g>

  <!-- Ydre ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
</svg>
