let gender = 'alle';
let mode   = 'kampe'; // 'kampe' | 'maal' | 'slutrunder'
const selectedPlayers = [];

const PALETTE = [
  '#C8102E','#1565C0','#2E7D32','#F57F17','#6A1B9A',
  '#00838F','#D84315','#37474F','#AD1457','#558B2F'
];

const canvas = document.getElementById('chart');
const ctx    = canvas.getContext('2d');
const GRAY   = '#DDDDDD';

function norm(s) {
  return (s || '').toLowerCase()
    .replace(/æ/g,'ae').replace(/ø/g,'oe').replace(/å/g,'aa')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function getFiltered() {
  return RAW.filter(p => gender === 'alle' || p.gender === gender);
}

function getKurve(p) {
  if (mode === 'maal')       return p.kurve_m;
  if (mode === 'slutrunder') return p.kurve_sl;
  return p.kurve;
}

function getTotal(p) {
  if (mode === 'maal')       return p.total_m;
  if (mode === 'slutrunder') return p.kurve_sl[p.kurve_sl.length - 1];
  return p.total;
}

function yLabel() {
  if (mode === 'maal')       return 'Mål';
  if (mode === 'slutrunder') return 'Slutrunder';
  return 'Kampe';
}

function nextColor() {
  return PALETTE[selectedPlayers.length % PALETTE.length];
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.parentElement.clientWidth - 48;
  const H   = 420;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);

  const PAD = { top: 20, right: 20, bottom: 40, left: 50 };
  const cW  = W - PAD.left - PAD.right;
  const cH  = H - PAD.top  - PAD.bottom;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);

  const data = getFiltered();
  const selectedIds = new Set(selectedPlayers.map(p => p.id));
  const maxY = Math.max(...data.map(p => Math.max(...getKurve(p))), 1);

  function xOf(age) { return PAD.left + (age - 15) / 30 * cW; }
  function yOf(v)   { return PAD.top  + cH - (v / maxY) * cH; }

  // Grid
  ctx.strokeStyle = '#f0f0f0'; ctx.lineWidth = 1;
  for (let v = 0; v <= maxY; v += Math.ceil(maxY / 6)) {
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cW, y); ctx.stroke();
    ctx.fillStyle = '#999'; ctx.font = '11px Inter,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(v, PAD.left - 6, y + 4);
  }

  ctx.fillStyle = '#999'; ctx.textAlign = 'center'; ctx.font = '11px Inter,sans-serif';
  for (let a = 15; a <= 45; a += 5) ctx.fillText(a, xOf(a), H - PAD.bottom + 16);
  ctx.fillStyle = '#666'; ctx.font = '12px Inter,sans-serif';
  ctx.fillText('Alder', PAD.left + cW / 2, H - 4);

  ctx.save(); ctx.translate(14, PAD.top + cH / 2);
  ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center';
  ctx.fillText(yLabel(), 0, 0); ctx.restore();

  // Grå linjer
  for (const p of data) {
    if (selectedIds.has(p.id)) continue;
    const kurve = getKurve(p);
    ctx.beginPath(); ctx.strokeStyle = GRAY; ctx.lineWidth = 1; ctx.globalAlpha = 0.7;
    kurve.forEach((v, i) => {
      const x = xOf(15 + i), y = yOf(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Valgte spillere
  for (const sp of selectedPlayers) {
    const kurve = getKurve(sp);
    ctx.beginPath(); ctx.strokeStyle = sp.color; ctx.lineWidth = 3;
    kurve.forEach((v, i) => {
      const x = xOf(15 + i), y = yOf(v);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
    ctx.fillStyle = sp.color;
    kurve.forEach((v, i) => {
      if (v > 0) {
        ctx.beginPath(); ctx.arc(xOf(15 + i), yOf(v), 3.5, 0, Math.PI * 2); ctx.fill();
      }
    });
  }
}

function updateLegend() {
  const el = document.getElementById('legend');
  let html = '<div class="legend-item"><div class="legend-line" style="background:#ddd"></div> Alle spillere</div>';
  for (const sp of selectedPlayers)
    html += `<div class="legend-item"><div class="legend-line" style="background:${sp.color}"></div> ${sp.navn}</div>`;
  el.innerHTML = html;
}

function updateTags() {
  document.getElementById('tags').innerHTML = selectedPlayers.map(sp =>
    `<span class="tag" style="background:${sp.color}">
      ${sp.navn} (${getTotal(sp)})
      <button class="tag-x" onclick="removePlayer('${sp.id}')">×</button>
    </span>`
  ).join('');
  document.getElementById('clear-btn').style.display = selectedPlayers.length ? '' : 'none';
}

function setGender(g, btn) {
  gender = g;
  document.querySelectorAll('.btn-group:first-child .gf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  draw();
}

function setMode(m, btn) {
  mode = m;
  document.querySelectorAll('.btn-group:nth-child(3) .gf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateTags();
  draw();
}

const playerById = Object.fromEntries(RAW.map(p => [p.id, p]));

function selectById(id) {
  const p = playerById[id];
  if (!p || selectedPlayers.find(sp => sp.id === p.id)) return;
  selectedPlayers.push({ ...p, color: nextColor() });
  document.getElementById('search').value = '';
  document.getElementById('suggestions').style.display = 'none';
  updateTags(); updateLegend(); draw();
}

function removePlayer(id) {
  const idx = selectedPlayers.findIndex(sp => sp.id === id);
  if (idx !== -1) selectedPlayers.splice(idx, 1);
  updateTags(); updateLegend(); draw();
}

function clearAll() {
  selectedPlayers.length = 0;
  document.getElementById('search').value = '';
  updateTags(); updateLegend(); draw();
}

const searchEl  = document.getElementById('search');
const suggestEl = document.getElementById('suggestions');

searchEl.addEventListener('input', () => {
  const term = norm(searchEl.value);
  if (!term) { suggestEl.style.display = 'none'; return; }
  const selectedIds = new Set(selectedPlayers.map(p => p.id));
  const hits = getFiltered().filter(p => norm(p.navn).includes(term) && !selectedIds.has(p.id)).slice(0, 10);
  if (!hits.length) { suggestEl.style.display = 'none'; return; }
  suggestEl.innerHTML = hits.map(p =>
    `<div class="suggestion" data-id="${p.id}">
      ${p.navn} <span style="color:#aaa;font-size:12px">(${p.total} kampe)</span>
    </div>`
  ).join('');
  suggestEl.style.display = 'block';
});

suggestEl.addEventListener('mousedown', e => {
  const div = e.target.closest('.suggestion');
  if (div) { e.preventDefault(); selectById(div.dataset.id); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) suggestEl.style.display = 'none';
});

canvas.addEventListener('click', e => {
  const rect   = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const W = rect.width, PAD = { left: 50, right: 20 };
  const cW = W - PAD.left - PAD.right;
  const ageI = Math.round(Math.max(15, Math.min(45, 15 + (mouseX - PAD.left) / cW * 30))) - 15;
  const mouseY = e.clientY - rect.top;
  const H = rect.height, PAD_V = { top: 20, bottom: 40 };
  const cH = H - PAD_V.top - PAD_V.bottom;
  const data = getFiltered();
  const maxY = Math.max(...data.map(p => Math.max(...getKurve(p))), 1);
  const valAtMouse = (1 - (mouseY - PAD_V.top) / cH) * maxY;
  let best = null, bestDist = Infinity;
  for (const p of data) {
    const dist = Math.abs((getKurve(p)[ageI] || 0) - valAtMouse);
    if (dist < bestDist) { bestDist = dist; best = p; }
  }
  if (best && bestDist < maxY * 0.15) selectById(best.id);
});

window.addEventListener('resize', draw);
draw();
</script>
</body>
</html>
